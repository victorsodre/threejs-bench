name: bench

# Runs the measurement harness and publishes the scorecard on every push/PR.
#
# NOTE: GitHub-hosted runners have no GPU, so WebGL falls back to software
# rendering (SwiftShader). Draw calls, triangles, requirement checks and the
# scorecard are meaningful and stable here; the reported FPS is NOT — use a
# self-hosted GPU runner if you need real frame rates.

on:
  push:
    branches: [main]
    paths: ['bench/**', 'claude/**', 'gpt/**', 'grok/**', 'grok4.6/**', '.github/workflows/bench.yml']
  pull_request:
    paths: ['bench/**', 'claude/**', 'gpt/**', 'grok/**', 'grok4.6/**', '.github/workflows/bench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: setup-chrome

      - name: Install harness deps
        working-directory: bench
        run: npm ci

      - name: Run harness + scorecard
        working-directory: bench
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run bench

      - name: Publish scorecard to job summary
        if: always()
        run: cat bench/results/bench01/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench/results/bench01/
