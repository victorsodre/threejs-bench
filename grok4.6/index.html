function mulberry32(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function canvasTex(size, draw, { repeat = 1, srgb = true, wrap = true } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (wrap) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = 16;
  t.repeat.set(repeat, repeat);
  t.needsUpdate = true;
  return t;
}

function drawTile(g, s) {
  g.fillStyle = '#66362a';

  for (let row = 0; row < s / th + 2; row++) {

      const v = 78 + Math.random() * 52;
      g.fillStyle = `rgb(${(v * 1.08 + 18) | 0},${(v * 0.44) | 0},${(v * 0.34) | 0})`;
      g.beginPath();
      g.moveTo(x + 2, y + 2);
      g.lineTo(x + tw - 2, y + 2);
      g.lineTo(x + tw - 4, y + th - 1);
      g.lineTo(x + 4, y + th - 1);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(28,12,8,0.38)';
      g.lineWidth = 1;
      g.stroke();
      g.strokeStyle = 'rgba(204,140,96,0.16)';

      g.lineTo(x + tw - 5, y + 3);

function drawStone(g, s) {

    g.fillRect(Math.random() * s, Math.random() * s, 2, 2);

      const v = 94 + Math.random() * 70;

      let r = v, grn = v * 0.95, b = v * 0.88;
      if (tint > 0.7) { r *= 1.06; grn *= 0.94; b *= 0.84; }
      if (tint < 0.15) { r *= 0.84; grn *= 0.9; b *= 1.06; }
      const ww = Math.min(bw, s - x - 4);
      g.fillStyle = `rgb(${r | 0},${grn | 0},${b | 0})`;
      g.fillRect(x, y, ww, rowH - 3);
      g.strokeStyle = 'rgba(28,26,22,0.46)';
      g.lineWidth = 1.5;
      g.strokeRect(x + 0.5, y + 0.5, ww - 1, rowH - 4);
      x += bw + 3;
    }
    y += rowH;
  }
}

function terrainHeight(x, z) {
  const d = Math.hypot(x, z);
  const flat = smooth(clamp(1 - d / 28, 0, 1));
  const h =
    Math.sin(x * 0.045) * Math.cos(z * 0.038) * 1.6 +
    Math.sin(x * 0.09 + 1.2) * 0.55 +
    Math.cos(z * 0.07 - 0.5) * 0.45;
  const river = Math.exp(-Math.pow((x + z * 0.35 + 18) / 9, 2)) * -1.4;
  return h * (1 - flat * 0.85) + river;
}

function makePathRibbon(points, width, mat) {
  const g = new THREE.Group();
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    const box = new THREE.Mesh(new THREE.BoxGeometry(width, 0.08, len + 0.16), mat);
    box.position.set((a.x + b.x) / 2, 0, (a.z + b.z) / 2);
    box.rotation.y = Math.atan2(dx, dz);
    box.position.y = terrainHeight(box.position.x, box.position.z) + 0.05;
    box.receiveShadow = true;
    g.add(box);
  }
  return g;
}
function pathPoints(fn, n = 24) {
  const pts = [];

    const p = fn(i / n);
    p.y = terrainHeight(p.x, p.z);
    pts.push(p);
  }
  return pts;
}

function gableRoofGeo(w, d, h) {
  const hw = w / 2, hd = d / 2;
  const positions = [];
  const uvs = [];
  const pushTri = (ax, ay, az, bx, by, bz, cx, cy, cz, u0, v0, u1, v1, u2, v2) => {
    positions.push(ax, ay, az, bx, by, bz, cx, cy, cz);
    uvs.push(u0, v0, u1, v1, u2, v2);
  };
  pushTri(-hw, 0, hd, hw, 0, hd, 0, h, hd, 0, 0, 1, 0, 0.5, 1);
  pushTri(-hw, 0, -hd, 0, h, -hd, hw, 0, -hd, 0, 0, 0.5, 1, 1, 0);
  pushTri(-hw, 0, hd, 0, h, hd, 0, h, -hd, 0, 0, 1, 0, 1, 1);
  pushTri(-hw, 0, hd, 0, h, -hd, -hw, 0, -hd, 0, 0, 1, 1, 0, 1);
  pushTri(hw, 0, hd, hw, 0, -hd, 0, h, -hd, 0, 0, 1, 0, 1, 1);
  pushTri(hw, 0, hd, 0, h, -hd, 0, h, hd, 0, 0, 1, 1, 0, 1);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.computeVertexNormals();
  return geo;
}

function addBeams(group, w, h, d, y0 = 0, t = 0.16) {
  const posts = [
    [-w / 2, y0 + h / 2, -d / 2], [w / 2, y0 + h / 2, -d / 2],
    [-w / 2, y0 + h / 2, d / 2], [w / 2, y0 + h / 2, d / 2],
  ];
  for (const [x, y, z] of posts) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(t, h, t), matDarkWood);
    m.position.set(x, y, z);
    m.castShadow = true;
    group.add(m);
  }
  for (const y of [y0 + 0.08, y0 + h * 0.5, y0 + h - 0.08]) {
    for (const [sx, sy, sz, px, py, pz] of [
      [w, t, t, 0, y, d / 2], [w, t, t, 0, y, -d / 2],
      [t, t, d, -w / 2, y, 0], [t, t, d, w / 2, y, 0],
    ]) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), matDarkWood);
      b.position.set(px, py, pz);
      b.castShadow = true;
      group.add(b);
    }
  }
  const brace = new THREE.Mesh(new THREE.BoxGeometry(w * 0.55, t * 0.8, t * 0.8), matDarkWood);
  brace.position.set(0, y0 + h * 0.52, d / 2 + 0.02);
  brace.rotation.z = deg(28);
  brace.castShadow = true;
  group.add(brace);
  const brace2 = brace.clone();
  brace2.rotation.z = deg(-28);
  group.add(brace2);
}

const smokeEmitters = [];
function makeSmokeSystem(origin) {
  const group = new THREE.Group();
  group.position.copy(origin);
  const geo = new THREE.SphereGeometry(0.2, 6, 6);
  const particles = [];
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: 0xc8b8a8, transparent: true, opacity: 0.28, depthWrite: false,
    }));
    m.userData = { t: i / 10, speed: 0.12 + Math.random() * 0.08, scale: 0.6 + Math.random() * 0.5, drift: Math.random() };
    group.add(m);
    particles.push(m);
  }
  smokeEmitters.push({ particles });
  return group;
}

function house({ w, d, floors, roofType, tint, rot, x, z }) {
  const g = new THREE.Group();
  const storyH = 2.35;
  const H = 0.35 + floors * storyH;
  const plasterMat = matStd(texPlaster, bumpPlaster, { color: tint, bumpScale: 0.1, roughness: 0.91 });
  const roofMat = roofType === 'tile' ? matTile : matThatch;
  const roofH = 1.55 + floors * 0.12;

  const found = new THREE.Mesh(new THREE.BoxGeometry(w + 0.28, 0.38, d + 0.28), matStone);
  found.position.y = 0.19;
  found.castShadow = true;
  found.receiveShadow = true;
  g.add(found);

  const body = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), plasterMat);
  body.position.y = 0.35 + H / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  if (floors >= 2) {
    const jetW = w * 1.08, jetD = d * 1.04;
    const jetH = storyH * 0.92;
    const jet = new THREE.Mesh(new THREE.BoxGeometry(jetW, jetH, jetD), plasterMat);
    jet.position.set(0, 0.35 + storyH + jetH / 2 + 0.04, 0.06);
    jet.castShadow = true;
    jet.receiveShadow = true;
    g.add(jet);
    const sill = new THREE.Mesh(new THREE.BoxGeometry(jetW + 0.08, 0.1, 0.22), matWood);
    sill.position.set(0, 0.35 + storyH + 0.02, d / 2 + 0.18);
    sill.castShadow = true;
    g.add(sill);
    addBeams(g, jetW, jetH, jetD, 0.35 + storyH);
  }
  addBeams(g, w, H, d, 0.35);

  const roof = new THREE.Mesh(gableRoofGeo(w + 0.6, d + 0.6, roofH), roofMat);
  roof.position.y = 0.35 + H;
  roof.castShadow = true;
  roof.receiveShadow = true;
  g.add(roof);

  const gableShape = new THREE.Shape();
  gableShape.moveTo(-w / 2, 0);
  gableShape.lineTo(w / 2, 0);
  gableShape.lineTo(0, roofH);
  gableShape.lineTo(-w / 2, 0);
  const gableGeo = new THREE.ShapeGeometry(gableShape);
  for (const s of [-1, 1]) {
    const gm = new THREE.Mesh(gableGeo, plasterMat);
    gm.position.set(0, 0.35 + H, s * (d / 2 + 0.02));
    if (s < 0) gm.rotation.y = Math.PI;
    g.add(gm);
  }

  const chim = makeChimney(1.35 + floors * 0.15);
  chim.position.set(w * 0.28, 0.35 + H + roofH * 0.35, -d * 0.15);
  g.add(chim);
  g.userData.chimneyLocal = chim.position.clone().add(new THREE.Vector3(0, 1.55, 0));

  const door = makeDoor();
  door.position.set(-w * 0.12, 0.35 + 0.86, d / 2 + 0.06);
  g.add(door);

  for (let f = 0; f < floors; f++) {
    const wy = 0.35 + f * storyH + storyH * 0.55;
    const wl = makeWindow(R() > 0.32);
    wl.position.set(-w * 0.3, wy, d / 2 + 0.05);
    g.add(wl);
    const wr = makeWindow(R() > 0.4);
    wr.position.set(w * 0.3, wy, d / 2 + 0.05);
    g.add(wr);
    if (R() > 0.38) {
      const ws = makeWindow(R() > 0.5);
      ws.position.set(w / 2 + 0.05, wy, 0);
      ws.rotation.y = Math.PI / 2;
      g.add(ws);
    }
    if (f === 0 && R() > 0.45) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 0.22), matWood);
      box.position.set(-w * 0.3, wy - 0.5, d / 2 + 0.16);
      box.castShadow = true;
      g.add(box);
    }
  }

  if (floors >= 2 && R() > 0.45) {
    const dorm = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.9, 0.7), plasterMat);
    dorm.position.set(w * 0.05, 0.35 + H + 0.2, d / 2 - 0.05);
    dorm.castShadow = true;
    g.add(dorm);
    const dRoof = new THREE.Mesh(gableRoofGeo(1.3, 0.9, 0.55), roofMat);
    dRoof.position.set(w * 0.05, 0.35 + H + 0.65, d / 2 - 0.05);
    dRoof.castShadow = true;
    g.add(dRoof);
    const dw = makeWindow(true);
    dw.scale.set(0.75, 0.7, 1);
    dw.position.set(w * 0.05, 0.35 + H + 0.15, d / 2 + 0.32);
    g.add(dw);
  }

  const eave = new THREE.Mesh(new THREE.BoxGeometry(w + 0.75, 0.08, 0.2), matWood);
  eave.position.set(0, 0.35 + H - 0.04, d / 2 + 0.16);
  eave.castShadow = true;
  g.add(eave);

  g.position.set(x, terrainHeight(x, z), z);
  g.rotation.y = rot;
  scene.add(g);

  const cl = g.userData.chimneyLocal;
  scene.add(makeSmokeSystem(new THREE.Vector3(
    x + Math.cos(rot) * cl.x - Math.sin(rot) * cl.z,
    g.position.y + cl.y,
    z + Math.sin(rot) * cl.x + Math.cos(rot) * cl.z
  )));
  return g;
}

const clock = new THREE.Clock();
let camT = 0;

function animateVillagers(dt) {
  for (const v of villagers) {
    const path = v.path;
    let a = path[v.seg % path.length];
    let b = path[(v.seg + 1) % path.length];
    v.t += (dt * v.speed) / Math.max(0.1, a.distanceTo(b));
    while (v.t >= 1) { v.t -= 1; v.seg = (v.seg + 1) % path.length; }
    a = path[v.seg % path.length];
    b = path[(v.seg + 1) % path.length];
    const x = lerp(a.x, b.x, v.t);
    const z = lerp(a.z, b.z, v.t);
    const y = terrainHeight(x, z);
    v.mesh.position.set(x, y, z);
    v.mesh.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
    v.bob += dt * 8 * v.speed;
    const legL = v.mesh.getObjectByName('legL');
    const legR = v.mesh.getObjectByName('legR');
    if (legL && legR) {
      legL.rotation.x = Math.sin(v.bob) * 0.55;
      legR.rotation.x = Math.sin(v.bob + Math.PI) * 0.55;
    }
    v.mesh.position.y = y + Math.abs(Math.sin(v.bob)) * 0.03;
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  camT += dt;
  waterUniforms.uTime.value = t;
  windmillBlades.rotation.z = t * 0.42;
  animateVillagers(dt);
  for (const { particles } of smokeEmitters) {
    for (const p of particles) {
      const u = p.userData;
      u.t += dt * u.speed;
      if (u.t > 1) u.t -= 1;
      p.position.set(Math.sin(u.t * 6 + u.drift * 10) * 0.25 * u.t, u.t * 3.5, Math.cos(u.t * 5 + u.drift * 8) * 0.2 * u.t);
      p.scale.setScalar(u.scale * (0.4 + u.t * 1.8));
      p.material.opacity = Math.sin(u.t * Math.PI) * 0.34 * (1 - u.t * 0.5);
    }
  }
  for (const b of birds) {
    const a = t * b.speed + b.phase;
    b.mesh.position.set(
      b.center.x + Math.cos(a) * b.radius,
      b.center.y + Math.sin(a * 2.3) * b.heightWobble,
      b.center.z + Math.sin(a) * b.radius
    );
    b.mesh.rotation.y = -a + Math.PI / 2;
    const flap = Math.sin(t * 12 + b.phase) * 0.6;
    const wL = b.mesh.getObjectByName('wL');
    const wR = b.mesh.getObjectByName('wR');
    if (wL && wR) { wL.rotation.z = flap; wR.rotation.z = -flap; }
  }
  for (let i = 0; i < FIREFLY_N; i++) {
    const f = fireflyData[i];
    dummy.position.set(
      f.x + Math.sin(t * f.speed + f.phase) * f.amp,
      f.y + Math.sin(t * f.speed * 1.3 + f.phase * 2) * 0.5,
      f.z + Math.cos(t * f.speed * 0.8 + f.phase) * f.amp
    );
    dummy.scale.setScalar(0.5 + (0.5 + 0.5 * Math.sin(t * 3 + f.phase)) * 1.2);
    dummy.updateMatrix();
    fireflies.setMatrixAt(i, dummy.matrix);
  }
  fireflies.instanceMatrix.needsUpdate = true;
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 100) c.position.x = -100;
  }
  for (const L of lanternLights) {
    const flicker = 1 + Math.sin(t * 7 + L.phase) * 0.08 + Math.sin(t * 13.7 + L.phase * 2) * 0.05;
    L.light.intensity = L.base * flicker;
    L.flame.material.emissiveIntensity = 3.1 * flicker;
  }
  sunGlow.scale.setScalar(1 + Math.sin(t * 0.5) * 0.04);
  if (!userTookControl) controls.target.y = 2.4 + Math.sin(camT * 0.15) * 0.28;
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
