function barrel(x,z){const b=cyl(.34,.4,.65,mat.wood,[x,.325,z]);for(let y=.18;y<.6;y+=.23){const ring=new THREE.Mesh(new THREE.TorusGeometry(.38,.035,6,12),mat.iron);ring.rotation.x=Math.PI/2;ring.position.set(x,y,z);scene.add(ring)}}for(let i=0;i<25;i++)barrel(rnd(-14,14),rnd(-10,10));
for(let i=0;i<25;i++){const x=rnd(-28,28),z=rnd(-28,28);if(Math.hypot(x,z)<12)continue;const h=rnd(.5,1.1);cyl(.36,.4,h,mat.straw,[x,h/2,z])}
function cart(x,z,rot){
 const g=new THREE.Group(),bed=new THREE.Mesh(new THREE.BoxGeometry(3.8,.48,1.8),mat.wood);bed.position.y=1.25;bed.castShadow=true;g.add(bed);
 for(const side of [-1,1]){const rail=new THREE.Mesh(new THREE.BoxGeometry(3.9,.85,.12),mat.wood);rail.position.set(0,1.75,side*.86);rail.castShadow=true;g.add(rail);const wheel=new THREE.Mesh(new THREE.TorusGeometry(.82,.12,8,22),mat.dark);wheel.position.set(0,.82,side*1.02);wheel.rotation.y=Math.PI/2;wheel.castShadow=true;g.add(wheel);for(let spoke=0;spoke<8;spoke++){const s=new THREE.Mesh(new THREE.BoxGeometry(.055,1.45,.055),mat.dark);s.position.copy(wheel.position);s.rotation.x=spoke*Math.PI/4;g.add(s)}}
 for(const side of [-1,1]){const shaft=new THREE.Mesh(new THREE.BoxGeometry(4.8,.11,.11),mat.wood);shaft.position.set(3.8,.9,side*.52);shaft.rotation.z=-.08;g.add(shaft)}
 for(let i=0;i<6;i++){const hay=new THREE.Mesh(new THREE.BoxGeometry(.8,.55,1.25),mat.straw);hay.position.set(rnd(-1.25,1.25),rnd(1.62,2.1),rnd(-.15,.15));hay.rotation.y=rnd(-.18,.18);hay.castShadow=true;g.add(hay)}
 g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
}
cart(-14,8,-.42);
function fence(x,z,len,rot=0){const g=new THREE.Group();for(let i=0;i<=len;i+=2){const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,1.1,6),mat.wood);p.position.set(i-len/2,.55,0);g.add(p)}for(const y of [.35,.78]){const r=new THREE.Mesh(new THREE.BoxGeometry(len,.09,.08),mat.wood);r.position.y=y;g.add(r)}g.position.set(x,0,z);g.rotation.y=rot;scene.add(g)}fence(16,-15,14,-.2);fence(-20,-17,13,.4);fence(17,17,11,1.1);
// lanterns, smoke, villagers, birds, fireflies
const lanterns=[];function lantern(x,z,physical){box(.08,2.7,.08,mat.iron,[x,1.35,z]);const l=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),mat.glow);l.position.set(x,2.5,z);scene.add(l);if(physical){const p=new THREE.PointLight(0xff8a35,1.7,10,2);p.position.copy(l.position);scene.add(p)}lanterns.push(l)}for(let i=0;i<22;i++)lantern(rnd(-22,22),rnd(-18,20),i<5);
const smoke=[];scene.updateMatrixWorld(true);homes.forEach(({g,chimney})=>{g.updateWorldMatrix(true,false);for(let j=0;j<6;j++){const p=new THREE.Mesh(new THREE.SphereGeometry(rnd(.08,.18),6,5),new THREE.MeshBasicMaterial({color:0xc8beb7,transparent:true,opacity:.12,depthWrite:false}));p.position.copy(g.localToWorld(chimney.position.clone()));p.position.y+=j*.24;p.userData={off:rnd(0,7),base:p.position.clone(),cycle:j/6};scene.add(p);smoke.push(p)}});
const people=[];function person(x,z){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(.18,.32,7),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(rnd(0,.1),.45,.28)}));body.position.y=.48;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.14,8,7),new THREE.MeshStandardMaterial({color:0xe4aa78}));head.position.y=.82;g.add(head);g.position.set(x,0,z);scene.add(g);people.push({g,phase:rnd(0,6.3),r:rnd(5,22),speed:rnd(.08,.16)})}for(let i=0;i<18;i++)person(rnd(-15,15),rnd(-12,12));
const birds=[];for(let i=0;i<22;i++){const b=new THREE.Group();for(const s of [-1,1]){const w=new THREE.Mesh(new THREE.ConeGeometry(.1,.72,4),new THREE.MeshBasicMaterial({color:0x302837,transparent:true,opacity:.76}));w.rotation.z=s*.8;b.add(w)}b.scale.setScalar(.48);b.position.set(rnd(-35,35),rnd(12,24),rnd(-30,30));scene.add(b);birds.push({b,a:rnd(0,6.2),r:rnd(18,44),y:b.position.y})}
const flies=[];for(let i=0;i<180;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(.025,5,5),new THREE.MeshBasicMaterial({color:0xffd96a}));f.position.set(rnd(-29,29),rnd(.25,3),rnd(-25,25));f.userData={p:f.position.clone(),o:rnd(0,6)};scene.add(f);flies.push(f)}
const animationStart=performance.now();
function animate(){
 requestAnimationFrame(animate);
 const t=(performance.now()-animationStart)*.001;
 waterMat.uniforms.time.value=t;
 millBlades.rotation.z=-t*.48;
 clouds.forEach((c,i)=>{c.position.x+=.008*(i%2?1:-1);if(Math.abs(c.position.x)>85)c.position.x*=-1});
 smoke.forEach(p=>{
  const u=p.userData,cycle=(t*.12+u.cycle+u.off*.015)%1,spread=cycle*cycle;
  p.position.x=u.base.x+Math.sin(t*.45+u.off)*spread*.9+spread*.65;
  p.position.z=u.base.z+Math.cos(t*.35+u.off)*spread*.7;
  p.position.y=u.base.y+cycle*2.5;
  p.material.opacity=.12*(1-cycle);
  p.scale.setScalar(.55+cycle*1.15);
 });
 people.forEach(o=>{const a=t*o.speed+o.phase;o.g.position.x=Math.cos(a)*o.r*.65;o.g.position.z=Math.sin(a*1.28)*o.r*.5;o.g.rotation.y=-a+1.5;o.g.position.y=Math.abs(Math.sin(t*4+o.phase))*.025});
 birds.forEach(o=>{const a=t*.12+o.a,flap=Math.sin(t*7+o.a)*.32;o.b.position.set(Math.cos(a)*o.r,o.y+Math.sin(t*1.9+o.a)*.5,Math.sin(a)*o.r);o.b.rotation.y=-a;o.b.children[0].rotation.z=.8+flap;o.b.children[1].rotation.z=-.8-flap});
 flies.forEach(f=>{const u=f.userData;f.position.set(u.p.x+Math.sin(t*1.8+u.o)*.28,u.p.y+Math.sin(t*2.4+u.o)*.25,u.p.z+Math.cos(t*1.4+u.o)*.28);f.visible=Math.sin(t*4+u.o)>.15});
 if(!touched){const orbit=t*.025+.55;camera.position.x=Math.cos(orbit)*55;camera.position.z=Math.sin(orbit)*55;camera.position.y=23+Math.sin(t*.055)*1.8}
 controls.update();
 composer.render();
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});animate();
</script></body></html>
